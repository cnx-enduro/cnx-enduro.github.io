<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chiang Mai Enduro Riders Tracks</title>
<meta name="description" content="Beginner-friendly enduro GPX routes around Chiang Mai, with notes and downloads.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cpath d='M5 24 L12 12 L17 19 L21 14 L27 24 Z' fill='%23f5a524'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=637637c6">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="title">Chiang Mai Enduro Riders Tracks</h1>
    <p id="subtitle" class="muted"></p>
  </div>
  <button class="btn small qrbtn" id="qrBtn" type="button" title="Show a QR code to open this page on a phone">QR code</button>
  <nav class="secnav" id="secNav" aria-label="Sections" hidden>
    <div class="seg" id="secTabs"></div>
    <select id="secPick" aria-label="Choose a section"></select>
  </nav>
</header>

<main class="layout">
  <section class="mapwrap">
    <div id="map" role="region" aria-label="Map of the tracks"></div>
    <div id="profile" hidden></div>
  </section>

  <aside class="panel">
    <div id="overview">
      <a class="back" id="toMain" href="#" hidden>← Easy enduro tracks</a>
      <div class="notice">
        <p id="intro"></p>
        <p id="restricted" class="strong"></p>
        <p id="noRide" class="noride"><i></i><span></span></p>
        <p id="shareNotice" class="share" hidden></p>
        <p id="riskNotice" class="share" hidden></p>
        <div id="noticeRows" hidden></div>
      </div>
      <!-- 4 guide tiles: tap one and its text opens under the tiles (one at a time) -->
      <nav class="guides" id="guides" aria-label="Guides">
        <a href="rules/"><span class="gic" style="--c:#f5a524">📜</span><b>Community rules</b><small>Read before joining a ride →</small></a>
        <a href="leaders/"><span class="gic" style="--c:#e05d2f">🧭</span><b>Leading a ride</b><small>Rules for ride leaders →</small></a>
        <button type="button" data-open="rules"><span class="gic" style="--c:#e0a020">📋</span><b>Before you ride</b><small>Gear and supplies</small></button>
        <a href="difficulty/"><span class="gic" style="--c:#2f9e6e">📶</span><b>Difficulty</b><small>L0–L4, with photos →</small></a>
        <button type="button" data-open="groupTip"><span class="gic" style="--c:#2f7cf6">👥</span><b>Group ride</b><small>Share live location</small></button>
        <button type="button" data-open="shareGuide"><span class="gic" style="--c:#b05cd6">🗺️</span><b>Sharing GPX</b><small>Do it responsibly</small></button>
      </nav>
      <details class="rules" id="rules">
        <summary id="rulesSummary">Read before riding</summary>
        <div id="rulesBody"></div>
      </details>
      <details class="rules" id="groupTip" hidden>
        <summary></summary>
        <div></div>
      </details>
      <details class="rules guide" id="shareGuide" hidden>
        <summary></summary>
        <div></div>
      </details>
      <div id="levelsBox" hidden></div>  <!-- difficulty levels, right above the tracks (Chu 11/19) -->
      <h2 class="section" id="listHead">Tracks</h2>
      <ol id="list" class="list"></ol>
      <details class="updates" id="changesHead"><summary class="section">Recent updates</summary>
        <ul id="changes" class="changes"></ul>
      </details>
      <p id="contribute" class="muted small"></p>
    </div>
    <article id="detail" hidden></article>
    <footer class="sitefoot" id="siteFoot" hidden></footer>
  </aside>
</main>
<dialog class="qrbox" id="qrBox" aria-labelledby="qrTitle">
  <h2 id="qrTitle">Scan to open on a phone</h2>
  <p class="qrtrack" id="qrTrackName" hidden></p>
  <div class="qrimg" id="qrImg"></div>
  <p class="muted small" id="qrUrl"></p>
  <button class="btn" id="qrClose" type="button">Close</button>
</dialog>

<script src="vendor/leaflet.min.js"></script>
<script src="vendor/leaflet-rotate.js"></script>
<script src="common.js?v=9b01a827"></script>
<script src="nav.js?v=308bd70d"></script>
<script src="firebase-config.js?v=6fb37bcf"></script>
<script src="ride.js?v=106a9aa7"></script>
<script src="app.js?v=2288f66f"></script>
</body>
</html>
