<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sharing GPX | Chiang Mai Enduro Riders</title>
<meta name="description" content="How to share GPX responsibly.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cpath d='M5 24 L12 12 L17 19 L21 14 L27 24 Z' fill='%23f5a524'/%3E%3C/svg%3E">
<!-- Sharing GPX (Chu 11/25: 4th Rules tab): Jul's guide, word for word, drawn from site.json shareGuide. -->
<style>

:root { --bg:#0b0c0e; --surface:#15171b; --surface-2:#1d2026; --line:#2a2e35; --text:#ecedef; --muted:#9aa0a9; --accent:#f5a524; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f6f6f4; --surface:#fff; --surface-2:#f0f0ed; --line:#deded9; --text:#17181a; --muted:#5d636b; --accent:#b86e00; color-scheme: light; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 18px 16px 32px; }
.back { display: inline-block; color: var(--accent); text-decoration: none; margin: 0 0 14px; }
h1 { font-size: clamp(26px, 6vw, 36px); margin: 0 0 4px; line-height: 1.15; }
.group { color: var(--muted); font-weight: 600; margin: 0 0 12px; }
.intro { font-size: 17px; margin: 0 0 18px; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
.jump a { text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 15px; padding: 8px 12px; border-radius: 10px; }
section { margin: 0 0 30px; scroll-margin-top: 12px; }
h2 { font-size: clamp(22px, 5vw, 28px); margin: 0 0 12px; }
.rule { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 8px; }
.num { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #111; font-weight: 800; font-size: 19px; display: grid; place-items: center; }
.rule b, .row b { display: block; font-size: 17px; line-height: 1.3; }
.rule span, .row span { display: block; color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 3px; }
.rule a { color: var(--accent); }
.hl { color: var(--accent); font-weight: 800; }
.strikes { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 0 0 8px; }
.strike { border-radius: 10px; padding: 14px; text-align: center; font-weight: 800; font-size: 17px; }
.strike small { display: block; font-weight: 600; font-size: 13px; opacity: .85; margin-bottom: 2px; }
.s1 { background: #3a2c08; color: #ffd36b; border: 1px solid #6b5212; }
.s2 { background: #3a0d0d; color: #ff8a8a; border: 1px solid #7a1c1c; }
.arrow { color: var(--muted); font-size: 22px; }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px 14px; }
.row { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row i { font-style: normal; font-size: 22px; line-height: 1.2; text-align: center; }
.leadlink { text-decoration: none; color: var(--text); border-color: var(--accent); }
.leadlink .num { background: var(--surface-2); font-size: 20px; }
.thanks { margin: 14px 0 0; font-weight: 600; }
footer { border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 14px; }
@media (max-width: 520px) { .rule b, .row b { font-size: 16px; } .strike { font-size: 16px; padding: 12px 8px; } }

/* pictures (tools/rules-graphics.py) */
.ico { position: relative; width: 52px; height: 52px; border-radius: 12px; background: #2a2110; color: var(--accent); display: grid; place-items: center; }
.ico svg { width: 34px; height: 34px; }
.ico .n { position: absolute; top: -7px; left: -7px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--accent); color: #111; font-size: 13px; font-weight: 800; display: grid; place-items: center; padding: 0 5px; }
.rule { grid-template-columns: 52px 1fr; gap: 14px; }
.row { grid-template-columns: 44px 1fr; }
.row .ico { width: 44px; height: 44px; border-radius: 10px; }
.row .ico svg { width: 28px; height: 28px; }
.fig { display: block; width: 100%; height: auto; margin: 10px 0 2px; }
.cards { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; }
.ycard, .rcard { width: 54px; height: 74px; border-radius: 6px; transform: rotate(-8deg); box-shadow: 0 4px 10px rgba(0,0,0,.5); }
.ycard { background: #f5c518; } .rcard { background: #e5484d; }
.cards b { font-size: 18px; } .cards small { display: block; color: var(--muted); font-size: 14px; font-weight: 600; }
.tiles4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 4px; }
.tiles4 div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.25; color: var(--text); }
.tiles4 div i { display: block; font-style: normal; font-size: 26px; margin-bottom: 4px; }
@media (max-width: 520px) { .tiles4 { grid-template-columns: repeat(2, 1fr); } }

.lead { font-size: 17px; margin: 0 0 18px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card b { display: block; font-size: 17px; line-height: 1.3; }
.card span { display: block; color: var(--muted); font-size: 15px; margin-top: 3px; }
.card small { display: block; color: var(--accent); font-weight: 800; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.pic { padding: 0; overflow: hidden; }
.pic img { display: block; width: 100%; height: auto; background: #eef2ee; }
.pic div { padding: 10px 12px 12px; }
.warn { background: #3a0d0d; color: #ffb4b4; border: 1px solid #7a1c1c; border-radius: 10px; padding: 12px 14px; font-weight: 700; margin-top: 8px; }
.note { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-weight: 700; margin-top: 8px; }
.big { background: #2a2110; border: 1px solid #6b5212; color: #ffd36b; border-radius: 10px; padding: 16px; font-weight: 800; font-size: 19px; margin: 0 0 8px; }
.tiles5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tiles5 div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.25; }
.tiles5 div i { display: block; font-style: normal; font-size: 26px; margin-bottom: 4px; }
.formation { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: 4px 0 10px; font-size: 12px; font-weight: 800; color: var(--muted); }
.formation span { text-align: center; }
.formation i { display: block; font-style: normal; font-size: 22px; }
.formation hr { flex: 1; border: 0; border-top: 2px dashed var(--line); margin: 0; }
ul.plain { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
@media (max-width: 720px) { .grid4 { grid-template-columns: repeat(2, 1fr); } .grid3 { grid-template-columns: 1fr; } .tiles5 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

.rtabs { display: flex; gap: 6px; margin: 0 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.rtabs a { padding: 10px 12px; min-height: 44px; text-decoration: none; color: var(--muted); font-weight: 800; font-size: 15px; border-bottom: 3px solid transparent; white-space: nowrap; }
.rtabs a.on { color: var(--text); border-bottom-color: var(--accent); }
/* Sharing GPX (moved here from the home page, Chu 11/25): drawn from site.json shareGuide via data/tracks.json */
.share { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.share .bhead { font-weight: 700; font-size: 16px; margin: 0 0 4px; }
.share .nrow { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
.share .nrow:first-of-type { border-top: 0; }
.share .nic { font-size: 18px; line-height: 1.3; text-align: center; }
.share .nrow b { display: block; font-size: 15px; line-height: 1.35; }
.share .nrow b + span { display: block; font-size: 14px; color: var(--muted); line-height: 1.45; margin-top: 1px; }
.share details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.share summary { cursor: pointer; font-weight: 700; color: var(--accent); min-height: 32px; }
.share ol { padding-left: 22px; } .share li { margin: 6px 0; }
.share img { display: block; width: 100%; height: auto; border-radius: 8px; margin: 10px 0 2px; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<main>
<a class="back" href="../">← All tracks</a>
<nav class="rtabs" aria-label="Rules"><a href="../rules/">Community</a><a href="../ride-rules/">Group ride</a><a href="../leaders/">Ride leaders</a><a href="../sharing/" class=on aria-current=page>Sharing GPX</a></nav>
<section id="sharing">
<h1 id="shareTitle">How to share GPX responsibly 🗺️</h1>
<div class="share" id="shareBox"><p class="muted">Loading…</p></div>
</section>

<footer>Last updated November 2026</footer>
</main>
<script>
// Sharing GPX guide: same words as before (site.json shareGuide), drawn here so there's one source.
(async () => {
  const box = document.getElementById("shareBox"), esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  try {
    const sg = (await (await fetch("../data/tracks.json")).json()).site.shareGuide;
    if (!sg) { document.getElementById("sharing").hidden = true; return; }
    document.getElementById("shareTitle").textContent = sg.title;
    const ps = a => (a || []).map(x => `<p>${esc(x)}</p>`).join("");
    const row = r => `<div class="nrow"><span class="nic" aria-hidden="true">${esc(r.icon || "")}</span><span><b>${esc(r.bold)}</b>${r.text ? `<span>${esc(r.text)}</span>` : ""}</span></div>`;
    const full = (sg.byline ? `<p class="muted">${esc(sg.byline)}</p>` : "") + ps(sg.intro) + (sg.rules ? `<ol>${sg.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ol>` : "") + ps(sg.outro) +
      (sg.photo ? `<img src="../${esc(sg.photo)}" alt="${esc(sg.photoAlt || "")}" loading="lazy">` : "");
    box.innerHTML = sg.summary ? `<p class="bhead">${esc(sg.summary.head)}</p>${sg.summary.rows.map(row).join("")}<details><summary>${esc(sg.summary.more)}</summary>${full}</details>` : full;
  } catch (e) { box.innerHTML = `<p class="muted">Couldn't load the guide. Check your connection and reload.</p>`; }
})();
</script>
</body>
</html>
